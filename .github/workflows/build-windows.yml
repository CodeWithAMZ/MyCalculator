name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.28.0 pyinstaller

      - name: Build executable
        run: flet pack MyCalculator.py --name MyCalculator --yes

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/MyCalculator.exe"
          if (!(Test-Path $exe)) {
            throw "Build failed: MyCalculator.exe was not found."
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("Executable size: {0:N2} MB" -f $size)

      - name: Package executable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MyCalculator.exe" -DestinationPath "MyCalculator-Windows.zip" -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCalculator-Windows
          path: MyCalculator-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MyCalculator-Windows.zip
          generate_release_notes: true
          tag_name: v0.1.0
          target_commitish: main
          name: My Calculator v0.1.0
